name: Android CI

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "rust-client/**"
      - "shared/**"
      - "scripts/native_client_provenance.ps1"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/build-release.yml"
  pull_request:
    paths:
      - "app/**"
      - "rust-client/**"
      - "shared/**"
      - "scripts/native_client_provenance.ps1"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NATIVE_API_LEVEL: "26"
  ANDROID_PLATFORM_PACKAGE: "37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"

jobs:
  build:
    name: Android and Rust client
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6.3.0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 \
            "platforms;android-${ANDROID_PLATFORM_PACKAGE}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-client -> target
          cache-targets: false
          key: android-client

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2

      - name: Verify Rust client
        working-directory: rust-client
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

      - name: Enforce runtime panic policy
        shell: pwsh
        run: ./rust-client/check_no_runtime_panics.ps1

      - name: Build Android native client
        shell: bash
        run: |
          set -euo pipefail
          build_client() {
            local abi="$1"
            local target="$2"
            local target_dir="$3"
            local destination="$4"
            (
              cd rust-client
              CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/${target_dir}" \
                cargo ndk -t "$abi" -P "$ANDROID_NATIVE_API_LEVEL" \
                  build --locked --release
            )
            install -Dm0755 \
              "${target_dir}/${target}/release/client" \
              "$destination"
          }

          build_client arm64-v8a aarch64-linux-android \
            build/rust-client-android-arm64 \
            app/src/main/jniLibs/arm64-v8a/libclient.so
          build_client armeabi-v7a armv7-linux-androideabi \
            build/rust-client-android-armv7 \
            app/src/main/jniLibs/armeabi-v7a/libclient.so
          build_client x86_64 x86_64-linux-android \
            build/rust-client-android-x86_64 \
            app/src/main/jniLibs/x86_64/libclient.so

      - name: Verify native client provenance
        shell: pwsh
        run: |
          ./scripts/native_client_provenance.ps1 -Mode Write
          ./scripts/native_client_provenance.ps1 -Mode Verify

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Test, lint and build debug APKs
        shell: bash
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: CSQTT-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

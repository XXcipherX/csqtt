name: Build CSQTT Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: Release title. Empty = CSQTT <version> (<tag>)
        required: false
        type: string
      changelog:
        description: Optional Markdown changelog
        required: false
        type: string
      draft:
        description: Create as draft release
        required: true
        default: false
        type: boolean
      prerelease:
        description: Mark release as prerelease
        required: true
        default: false
        type: boolean

env:
  ZIG_VERSION: "0.16.0"
  ANDROID_MIN_API: "26"
  ANDROID_PLATFORM_PACKAGE: "37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"

jobs:
  build-linux-server:
    name: Linux server (${{ matrix.asset }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: amd64
            rust_target: x86_64-unknown-linux-musl
            asset: csqtt-linux-amd64
          - id: arm64
            rust_target: aarch64-unknown-linux-musl
            asset: csqtt-linux-arm64
          - id: armv7
            rust_target: armv7-unknown-linux-musleabihf
            asset: csqtt-linux-armv7

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Linux server build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-server -> build/linux-musl
          cache-targets: true
          key: release-linux-${{ matrix.id }}

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@0.23.3
          fallback: none

      - name: Build Linux server
        shell: bash
        run: |
          set -euo pipefail
          chmod +x rust-server/build_linux.sh
          rust-server/build_linux.sh --no-tests --target "${{ matrix.id }}"

      - name: Upload Linux server
        uses: actions/upload-artifact@v7
        with:
          name: linux-server-${{ matrix.id }}
          path: rust-server/dist/${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-android-client:
    name: Android native client (${{ matrix.abi }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: arm64
            abi: arm64-v8a
            rust_target: aarch64-linux-android
            target_dir: build/rust-client-android-arm64
            asset: libclient-arm64-v8a.so
          - id: armv7
            abi: armeabi-v7a
            rust_target: armv7-linux-androideabi
            target_dir: build/rust-client-android-armv7
            asset: libclient-armeabi-v7a.so
          - id: x86_64
            abi: x86_64
            rust_target: x86_64-linux-android
            target_dir: build/rust-client-android-x86_64
            asset: libclient-x86_64.so

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Android native client build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-client -> ../${{ matrix.target_dir }}
          cache-targets: true
          key: release-android-${{ matrix.id }}

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2

      - name: Build Android native client
        shell: bash
        run: |
          set -euo pipefail
          (
            cd rust-client
            CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/${{ matrix.target_dir }}" cargo ndk \
              -t "${{ matrix.abi }}" -P "$ANDROID_MIN_API" build --locked --release
          )
          install -Dm0755 "${{ matrix.target_dir }}/${{ matrix.rust_target }}/release/client" \
            "build/native-artifacts/${{ matrix.asset }}"

      - name: Upload Android native client
        uses: actions/upload-artifact@v7
        with:
          name: android-client-${{ matrix.id }}
          path: build/native-artifacts/${{ matrix.asset }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-release:
    name: Package release APKs and artifacts
    needs:
      - build-linux-server
      - build-android-client
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6.3.0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --channel=3 \
            "platforms;android-${ANDROID_PLATFORM_PACKAGE}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Download Linux server binaries
        uses: actions/download-artifact@v8
        with:
          pattern: linux-server-*
          path: build/downloads/server
          merge-multiple: true

      - name: Download Android native clients
        uses: actions/download-artifact@v8
        with:
          pattern: android-client-*
          path: build/downloads/client
          merge-multiple: true

      - name: Restore release binaries
        shell: bash
        run: |
          set -euo pipefail
          install -Dm0755 build/downloads/server/csqtt-linux-amd64 \
            app/src/main/assets/csqtt-linux-amd64
          install -Dm0755 build/downloads/server/csqtt-linux-arm64 \
            app/src/main/assets/csqtt-linux-arm64
          install -Dm0755 build/downloads/server/csqtt-linux-armv7 \
            app/src/main/assets/csqtt-linux-armv7
          rm -f app/src/main/assets/csqtt

          restore_client() {
            local source="$1"
            local cargo_output="$2"
            local production_output="$3"
            install -Dm0755 "$source" "$cargo_output"
            install -Dm0755 "$source" "$production_output"
          }

          restore_client \
            build/downloads/client/libclient-arm64-v8a.so \
            build/rust-client-android-arm64/aarch64-linux-android/release/client \
            app/src/main/jniLibs/arm64-v8a/libclient.so
          restore_client \
            build/downloads/client/libclient-armeabi-v7a.so \
            build/rust-client-android-armv7/armv7-linux-androideabi/release/client \
            app/src/main/jniLibs/armeabi-v7a/libclient.so
          restore_client \
            build/downloads/client/libclient-x86_64.so \
            build/rust-client-android-x86_64/x86_64-linux-android/release/client \
            app/src/main/jniLibs/x86_64/libclient.so

      - name: Verify release binary provenance
        shell: pwsh
        run: |
          ./scripts/server_asset_provenance.ps1 -Mode Write
          ./scripts/server_asset_provenance.ps1 -Mode Verify
          ./scripts/native_client_provenance.ps1 -Mode Write
          ./scripts/native_client_provenance.ps1 -Mode Verify

      - name: Resolve Android release version
        id: android_version
        shell: bash
        run: |
          set -euo pipefail
          source_version_code="$(sed -nE 's/^[[:space:]]*val defaultVersionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)"
          source_version_name="$(sed -nE 's/^[[:space:]]*val defaultVersionName = "([0-9]+([.][0-9]+)*)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if ! [[ "$source_version_code" =~ ^[0-9]+$ ]]; then
            echo "Unable to read the source versionCode from app/build.gradle.kts"
            exit 1
          fi
          if ! [[ "$source_version_name" =~ ^[0-9]+([.][0-9]+)*$ ]]; then
            echo "Unable to read the source versionName from app/build.gradle.kts"
            exit 1
          fi
          if (( GITHUB_RUN_NUMBER >= 100000 )); then
            echo "GITHUB_RUN_NUMBER is too large for the automatic versionCode scheme"
            exit 1
          fi
          version_code=$((source_version_code * 100000 + GITHUB_RUN_NUMBER))
          version_name="${source_version_name}.${GITHUB_RUN_NUMBER}"
          if (( version_code > 2100000000 )); then
            echo "Calculated versionCode exceeds Android's limit: $version_code"
            exit 1
          fi
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          printf '### Android release\n\n- versionName: %s\n- versionCode: %s\n' \
            "$version_name" "$version_code" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore permanent release keystore
        id: release_keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!variable:-}" ]; then
              echo "Required Android release signing secret is missing: $variable"
              exit 1
            fi
          done
          keystore_path="${RUNNER_TEMP}/csqtt-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          keytool -list -keystore "$keystore_path" -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null
          echo "keystore_path=$keystore_path" >> "$GITHUB_OUTPUT"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Build Android release APKs
        shell: bash
        env:
          KEYSTORE_FILE: ${{ steps.release_keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew clean :app:assembleRelease \
            -PreleaseVersionCode=${{ steps.android_version.outputs.version_code }} \
            -PreleaseVersionName=${{ steps.android_version.outputs.version_name }} \
            --no-daemon --stacktrace

      - name: Verify APK signatures, versions and deployment assets
        shell: bash
        env:
          KEYSTORE_PATH: ${{ steps.release_keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_VERSION_CODE: ${{ steps.android_version.outputs.version_code }}
          EXPECTED_VERSION_NAME: ${{ steps.android_version.outputs.version_name }}
        run: |
          set -euo pipefail
          apksigner="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          aapt="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/aapt"
          normalize_sha256() {
            tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]'
          }
          expected_cert_sha256="$(
            keytool -exportcert -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" | sha256sum | awk '{print $1}' | normalize_sha256
          )"
          if [[ ! "$expected_cert_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Unable to calculate the release keystore certificate SHA-256"
            exit 1
          fi
          mapfile -t apks < <(find app/build/outputs/apk/release -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No release APKs were generated"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$apksigner" verify --verbose "$apk"
            certificate_report="$("$apksigner" verify --print-certs "$apk")"
            actual_cert_sha256="$(
              printf '%s\n' "$certificate_report" |
                awk 'match($0, /certificate SHA-256 digest:[[:space:]]*/) {
                  print substr($0, RSTART + RLENGTH)
                  exit
                }' |
                normalize_sha256
            )"
            if [[ ! "$actual_cert_sha256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Unable to read the signing certificate SHA-256 from: $apk"
              exit 1
            fi
            if [ "$actual_cert_sha256" != "$expected_cert_sha256" ]; then
              echo "Signing certificate mismatch: $apk"
              echo "Expected certificate SHA-256: $expected_cert_sha256"
              echo "APK signer certificate SHA-256: $actual_cert_sha256"
              exit 1
            fi
            badging="$("$aapt" dump badging "$apk")"
            actual_version_code="$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p")"
            actual_version_name="$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")"
            if [ "$actual_version_code" != "$EXPECTED_VERSION_CODE" ]; then
              echo "versionCode mismatch in $apk: expected $EXPECTED_VERSION_CODE, got $actual_version_code"
              exit 1
            fi
            if [ "$actual_version_name" != "$EXPECTED_VERSION_NAME" ]; then
              echo "versionName mismatch in $apk: expected $EXPECTED_VERSION_NAME, got $actual_version_name"
              exit 1
            fi
            pwsh -NoProfile -File scripts/verify_apk_deploy_asset.ps1 -ApkPath "$apk"
          done
          printf -- '- signing certificate SHA-256: %s\n- verified APKs: %s\n' \
            "$expected_cert_sha256" "${#apks[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare release assets and changelog
        id: release_meta
        shell: bash
        env:
          INPUT_RELEASE_NAME: ${{ inputs.release_name }}
          INPUT_CHANGELOG: ${{ inputs.changelog }}
          RELEASE_VERSION_NAME: ${{ steps.android_version.outputs.version_name }}
        run: |
          set -euo pipefail
          mkdir -p build/release-assets build/rust-client build/server
          mapfile -t apks < <(find app/build/outputs/apk/release -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No release APKs were generated"
            exit 1
          fi
          for apk in "${apks[@]}"; do
            case "$(basename "$apk")" in
              *arm64-v8a*) output="CSQTT-arm64-v8a.apk" ;;
              *armeabi-v7a*) output="CSQTT-armeabi-v7a.apk" ;;
              *x86_64*) output="CSQTT-x86_64.apk" ;;
              *universal*) output="CSQTT-universal.apk" ;;
              *) output="$(basename "$apk")" ;;
            esac
            cp "$apk" "build/release-assets/$output"
          done
          cp app/src/main/assets/csqtt-linux-amd64 build/server/
          cp app/src/main/assets/csqtt-linux-arm64 build/server/
          cp app/src/main/assets/csqtt-linux-armv7 build/server/
          cp app/src/main/jniLibs/arm64-v8a/libclient.so build/rust-client/libclient-arm64-v8a.so
          cp app/src/main/jniLibs/armeabi-v7a/libclient.so build/rust-client/libclient-armeabi-v7a.so
          cp app/src/main/jniLibs/x86_64/libclient.so build/rust-client/libclient-x86_64.so

          tag="v${RELEASE_VERSION_NAME}"
          release_name="${INPUT_RELEASE_NAME:-CSQTT ${RELEASE_VERSION_NAME} (${tag})}"
          previous_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$INPUT_CHANGELOG" ]; then
            changelog="$INPUT_CHANGELOG"
          elif [ -n "$previous_tag" ]; then
            changelog="$(git log --pretty=format:'- %s (%h)' "${previous_tag}..HEAD")"
          else
            changelog="$(git log -n 30 --pretty=format:'- %s (%h)')"
          fi
          [ -n "$changelog" ] || changelog="- Release build from ${GITHUB_SHA::7}"
          printf '%s\n' "$changelog" > build/release-notes.md
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_name }}
          body_path: build/release-notes.md
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: build/release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CSQTT-release-build
          path: |
            build/release-assets/*
            build/server/*
            build/rust-client/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove release keystore
        if: always()
        shell: bash
        env:
          KEYSTORE_PATH: ${{ steps.release_keystore.outputs.keystore_path }}
        run: |
          if [ -n "${KEYSTORE_PATH:-}" ] && [ -f "$KEYSTORE_PATH" ]; then
            shred -u "$KEYSTORE_PATH" || rm -f "$KEYSTORE_PATH"
          fi

version: 2

updates:
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: daily
      time: "04:10"
      timezone: Europe/Moscow
    open-pull-requests-limit: 20
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "04:20"
      timezone: Europe/Moscow
    open-pull-requests-limit: 20
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
